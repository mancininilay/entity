# bh_proto input: T12 capacity: 4 ions at Gamma_p = 6, dK/K = 1e-4 per step, 2000 steps, pair maxnpart = 60 (about 120 pairs due), on_capacity = error; on_capacity_estimate = warn so that the run deliberately reaches the exhaustion
[simulation]
  name    = "t12_capacity_error"
  engine  = "srpic"
  runtime = 1000.0

[grid]
  resolution = [16]
  extent     = [[0.0, 16.0]]
  [grid.metric]
    metric = "minkowski"
  [grid.boundaries]
    fields    = [["PERIODIC"]]
    particles = [["PERIODIC"]]

[scales]
  larmor0    = 1.0
  skindepth0 = 1.0

[algorithms]
  [algorithms.timestep]
    CFL = 0.5
  [algorithms.fieldsolver]
    enable = false
  [algorithms.deposit]
    enable = false

[particles]
  ppc0        = 1.0
  use_weights = true
  [[particles.species]]
    label                    = "ion"
    mass                     = 1.0
    charge                   = 1.0
    maxnpart                 = 1e3
    pusher                   = "Boris"
    n_payloads_real          = 3
    deposit                  = false
    clear_interval           = 0
    spatial_sorting_interval = 0
  [[particles.species]]
    label                    = "e-"
    mass                     = 1.0
    charge                   = -1.0
    maxnpart                 = 60.0
    pusher                   = "Boris"
    n_payloads_real          = 3
    deposit                  = false
    clear_interval           = 0
    spatial_sorting_interval = 0
  [[particles.species]]
    label                    = "e+"
    mass                     = 1.0
    charge                   = 1.0
    maxnpart                 = 60.0
    pusher                   = "Boris"
    n_payloads_real          = 3
    deposit                  = false
    clear_interval           = 0
    spatial_sorting_interval = 0

[setup]
  hadronic.enabled    = true
  hadronic.species    = [1]
  tau0                = 0.562960
  physical_mass_ratio = 1836.15
  photon_field.type   = "mono"
  photon_field.eps0   = 0.5
  source              = "budget"
  spectrum            = "delta"
  pair_species        = [2, 3]
  r_th_factor         = 10.0
  f_r                 = 0.02
  t_latency           = 0.0
  gamma_p_typical     = 6.0
  ions.K              = [9180.75]
  ions.per_K          = 4
  ions.direction      = "+x"
  ledger.every        = 100
  on_capacity         = "error"
  on_capacity_estimate = "warn"

[output]
  interval = 100000000
  [output.fields]
    enable = false
  [output.particles]
    enable = false
  [output.spectra]
    enable = false
  [output.stats]
    enable = false

[checkpoint]
  interval = 100000000

[diagnostics]
  interval = 100000000
