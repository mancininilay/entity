# bh_proto input (MPI; D2 fix of 2026-11-03): the array closure after migration. Periodic 1D box of 32 cells (8 cells per
# domain on 4 ranks: Entity requires at least 5), event mode, RESTFRAME spectrum: the two leptons of a pair have different
# momenta, so they cross domain boundaries on different steps and their slots stop being partners. 32 ions in all (the
# script tests/hadronic/arrays_species.sh sets simulation.domain and ions.per_K = 16 / ranks, and the mode). Expected on
# 1, 2 and 4 ranks: "array leptons" line with every pair complete, residual - E_round within 1e-5 (single) or 1e-12 (double).
[simulation]
  name    = "arrays_restframe_periodic"
  engine  = "srpic"
  runtime = 100.0
  seed    = 12345
  [simulation.domain]
    number        = 1
    decomposition = [1]

[grid]
  resolution = [32]
  extent     = [[0.0, 32.0]]
  [grid.metric]
    metric = "minkowski"
  [grid.boundaries]
    fields    = [["PERIODIC"]]
    particles = [["PERIODIC"]]

[scales]
  larmor0    = 1.0
  skindepth0 = 1.0

[algorithms]
  [algorithms.timestep]
    CFL = 0.5
  [algorithms.fieldsolver]
    enable = false
  [algorithms.deposit]
    enable = false

[particles]
  ppc0        = 1.0
  use_weights = true
  [[particles.species]]
    label                    = "ion"
    mass                     = 1.0
    charge                   = 1.0
    maxnpart                 = 1e3
    pusher                   = "Boris"
    n_payloads_real          = 3
    deposit                  = false
    clear_interval           = 0
    spatial_sorting_interval = 0
  [[particles.species]]
    label                    = "e-"
    mass                     = 1.0
    charge                   = -1.0
    maxnpart                 = 2e4
    pusher                   = "Boris"
    n_payloads_real          = 3
    deposit                  = false
    clear_interval           = 0
    spatial_sorting_interval = 0
  [[particles.species]]
    label                    = "e+"
    mass                     = 1.0
    charge                   = 1.0
    maxnpart                 = 2e4
    pusher                   = "Boris"
    n_payloads_real          = 3
    deposit                  = false
    clear_interval           = 0
    spatial_sorting_interval = 0

[setup]
  hadronic.enabled    = true
  hadronic.placement  = "production"
  qk_source           = "born"
  hadronic.species    = [1]
  mode                = "event"
  tau0                = 0.4
  physical_mass_ratio = 1836.15
  photon_field.type   = "mono"
  photon_field.eps0   = 0.5
  spectrum            = "restframe"
  pair_species        = [2, 3]
  pair_weight         = 1.0
  f_max               = 0.01
  gamma_p_typical     = 6.0
  ions.K              = [3672.3, 9180.75]
  ions.per_K          = 16
  ions.direction      = "+x"
  ledger.every        = 50

[output]
  interval = 100000000
  [output.fields]
    enable = false
  [output.particles]
    enable = false
  [output.spectra]
    enable = false
  [output.stats]
    enable = false

[checkpoint]
  interval = 100000000

[diagnostics]
  interval = 100000000
