# bh_proto input (MPI, 4 ranks; Rusty G3; not run in the cloud rounds): T14b-lite, absorbing x walls at the
# production placement with four domains in x (C-MPI-3 allows it; the post-step placement is refused in an MPI build),
# 16 ions per domain at Gamma_p = 6 drifting at c along +x, dK/K = 1e-3 per step, budget source, t_latency auto, 60 steps.
# Expected: the reduced ledger closes with the exported term, E_exported_host = E_exported over the ranks, every absorbed
# ion harvested exactly once (C-MPI-1). Run as: mpirun -np 4 entity.xc -input t14b_absorb_production_4ranks.toml
[simulation]
  name    = "t14b_absorb_production_4ranks"
  engine  = "srpic"
  runtime = 30.0
  [simulation.domain]
    number        = 4
    decomposition = [4]

[grid]
  resolution = [64]
  extent     = [[0.0, 64.0]]
  [grid.metric]
    metric = "minkowski"
  [grid.boundaries]
    fields    = [["MATCH", "MATCH"]]
    particles = [["ABSORB", "ABSORB"]]
    [grid.boundaries.match]
      ds = [[2.0]]

[scales]
  larmor0    = 1.0
  skindepth0 = 1.0

[algorithms]
  [algorithms.timestep]
    CFL = 0.5
  [algorithms.fieldsolver]
    enable = false
  [algorithms.deposit]
    enable = false

[particles]
  ppc0        = 1.0
  use_weights = true
  [[particles.species]]
    label                    = "ion"
    mass                     = 1.0
    charge                   = 1.0
    maxnpart                 = 1e3
    pusher                   = "Boris"
    n_payloads_real          = 3
    deposit                  = false
    clear_interval           = 0
    spatial_sorting_interval = 0
  [[particles.species]]
    label                    = "e-"
    mass                     = 1.0
    charge                   = -1.0
    maxnpart                 = 2e4
    pusher                   = "Boris"
    n_payloads_real          = 3
    deposit                  = false
    clear_interval           = 0
    spatial_sorting_interval = 0
  [[particles.species]]
    label                    = "e+"
    mass                     = 1.0
    charge                   = 1.0
    maxnpart                 = 2e4
    pusher                   = "Boris"
    n_payloads_real          = 3
    deposit                  = false
    clear_interval           = 0
    spatial_sorting_interval = 0

[setup]
  hadronic.enabled     = true
  hadronic.species     = [1]
  hadronic.placement   = "production"
  tau0                 = 5.62960
  physical_mass_ratio  = 1836.15
  photon_field.type    = "mono"
  photon_field.eps0    = 0.5
  source               = "budget"
  spectrum             = "delta"
  pair_species         = [2, 3]
  r_th_factor          = 10.0
  f_r                  = 0.02
  t_latency            = "auto"
  gamma_p_typical      = 6.0
  ions.K               = [9180.75]
  ions.per_K           = 16
  ions.direction       = "+x"
  ledger.every         = 50

[output]
  interval = 100000000
  [output.fields]
    enable = false
  [output.particles]
    enable = false
  [output.spectra]
    enable = false
  [output.stats]
    enable = false

[checkpoint]
  interval = 100000000
