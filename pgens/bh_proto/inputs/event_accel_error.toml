# bh_proto input (step 5 round 2, F2, 2026-10-30): Codex 1's review probe "production-accelerated" (review 2026-10-30-codex1-cpp-event-mode.md, finding F2) under on_bound = error: 16 ions at Gamma_p = 2.4 (admitted: a_max = 3.46, lambda = 0.05 on the declared band) accelerated by the prescribed E_x = 13220.28 to Gamma_p = 6.0 within the single step (dt = 0.5), where R <D> dt / (f_max K) = 6.003 and lambda = 65.9. At 30c551f7 the run exited 0 with 1002 pairs. Revision 1.1: error flags the 16 ion-steps at step 0 and aborts at the common point (n_bounded = 16, no pair); warn sub-cycles the hazard in m = 7 chunks (n_substeps = 112), creates the pairs, identity exact.
# base: Codex 1's probe input verbatim (review bundle p2-cpp-event-review-codex1-20261030/production-accelerated/input.toml) but for
# the name, the removed key test.bypass_amax (F1) and on_bound; one step of dt = 0.5, simulation.seed = 12345, max_events_per_step = 1000, ledger.every = 1
[simulation]
  name    = "event_accel_error"
  engine  = "srpic"
  runtime = 0.5
  seed    = 12345

[grid]
  resolution = [16]
  extent     = [[0.0, 16.0]]
  [grid.metric]
    metric = "minkowski"
  [grid.boundaries]
    fields    = [["PERIODIC"]]
    particles = [["PERIODIC"]]

[scales]
  larmor0    = 1.0
  skindepth0 = 1.0

[algorithms]
  [algorithms.timestep]
    CFL = 0.5
  [algorithms.fieldsolver]
    enable = false
  [algorithms.deposit]
    enable = false

[particles]
  ppc0        = 1.0
  use_weights = true
  [[particles.species]]
    label                    = "ion"
    mass                     = 1.0
    charge                   = 1.0
    maxnpart                 = 1e3
    pusher                   = "Boris"
    n_payloads_real          = 3
    deposit                  = false
    clear_interval           = 0
    spatial_sorting_interval = 0
  [[particles.species]]
    label                    = "e-"
    mass                     = 1.0
    charge                   = -1.0
    maxnpart                 = 2e4
    pusher                   = "Boris"
    n_payloads_real          = 3
    deposit                  = false
    clear_interval           = 0
    spatial_sorting_interval = 0
  [[particles.species]]
    label                    = "e+"
    mass                     = 1.0
    charge                   = 1.0
    maxnpart                 = 2e4
    pusher                   = "Boris"
    n_payloads_real          = 3
    deposit                  = false
    clear_interval           = 0
    spatial_sorting_interval = 0

[setup]
  hadronic.enabled    = true
  hadronic.placement = "production"
  hadronic.species    = [1]
  mode                = "event"
  tau0                = 337.9363341361285
  physical_mass_ratio = 1836.15
  photon_field.type   = "mono"
  photon_field.eps0   = 0.5
  spectrum            = "delta"
  pair_species        = [2, 3]
  pair_weight         = 1.0
  f_max               = 0.01
  gamma_p_typical     = 2.4
  ions.K              = [2570.61]
  ions.per_K          = 16
  ions.direction      = "+x"
  ledger.every        = 1
  on_bound            = "error"
  fields.E = [13220.28, 0.0, 0.0]
  max_events_per_step = 1000

[output]
  interval = 100000000
  [output.fields]
    enable = false
  [output.particles]
    enable = false
  [output.spectra]
    enable = false
  [output.stats]
    enable = false

[checkpoint]
  interval = 100000000

[diagnostics]
  interval = 100000000
