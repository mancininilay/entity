# bh_proto input: the ion-in-a-box demonstration (P2 step 8; plan notes/2026-10-30-claude1-demonstration-plan.md),
# generated by make_inputs.py: spectrum run at Gamma_p0 = 3, poisson, restframe, 40 steps, N_ion = 2.5e5
# Periodic 1D box, fields zero (field solver off), deposit off, mono bath eps0 = 0.5, mu_r = 1836.15, mu_d = 1,
# qk_source = born (production default), N_ion ions at Gamma_p0 along +x. The pair species have pusher "none":
# in zero fields the Boris push is the identity on u and positions do not enter (deposit off), so not pushing the
# tens of millions of pairs changes nothing in the hadronic physics (stated in the demonstration report).
[simulation]
  name    = "spec_g3_poisson"
  engine  = "srpic"
  runtime = 20.0
  seed    = 20261046

[grid]
  resolution = [64]
  extent     = [[0.0, 64.0]]
  [grid.metric]
    metric = "minkowski"
  [grid.boundaries]
    fields    = [["PERIODIC"]]
    particles = [["PERIODIC"]]

[scales]
  larmor0    = 1.0
  skindepth0 = 1.0

[algorithms]
  [algorithms.timestep]
    CFL = 0.5
  [algorithms.fieldsolver]
    enable = false
  [algorithms.deposit]
    enable = false

[particles]
  ppc0        = 1.0
  use_weights = true
  [[particles.species]]
    label                    = "ion"
    mass                     = 1.0
    charge                   = 1.0
    maxnpart                 = 262564.0
    pusher                   = "Boris"
    n_payloads_real          = 3
    deposit                  = false
    clear_interval           = 0
    spatial_sorting_interval = 0
  [[particles.species]]
    label                    = "e-"
    mass                     = 1.0
    charge                   = -1.0
    maxnpart                 = 3000000.0
    pusher                   = "none"
    n_payloads_real          = 3
    deposit                  = false
    clear_interval           = 0
    spatial_sorting_interval = 0
  [[particles.species]]
    label                    = "e+"
    mass                     = 1.0
    charge                   = 1.0
    maxnpart                 = 3000000.0
    pusher                   = "none"
    n_payloads_real          = 3
    deposit                  = false
    clear_interval           = 0
    spatial_sorting_interval = 0

[setup]
  hadronic.enabled    = true
  hadronic.placement  = "production"
  hadronic.species    = [1]
  tau0                = 7.862350556
  physical_mass_ratio = 1836.15
  photon_field.type   = "mono"
  photon_field.eps0   = 0.5
  qk_source           = "born"
  pair_species        = [2, 3]
  gamma_p_typical     = 3.0
  ions.K              = [3672.3]
  ions.per_K          = 250000
  ions.direction      = "+x"
  ledger.every        = 40
  mode                = "continuous"
  source              = "poisson"
  spectrum            = "restframe"
  pair_weight         = 1.0
  on_capacity_estimate = "warn"

[output]
  interval = 100000000
  [output.fields]
    enable = false
  [output.particles]
    enable = false
  [output.spectra]
    enable = false
  [output.stats]
    enable = false

[checkpoint]
  interval = 100000000

[diagnostics]
  interval       = 100000000
  colored_stdout = false
